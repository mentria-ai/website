name: Deploy Static Content to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - '.eleventy.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/static.yml'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      notes: ${{ steps.notes.outputs.notes }}
      indexnow_key: ${{ steps.changed.outputs.key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Name the release
        id: tag
        run: |
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"; n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do n=$((n+1)); tag="$base-$n"; done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prev=$(git tag --list 'v*' --sort=-creatordate | head -n1)" >> "$GITHUB_OUTPUT"
      - name: Generate the release notes for the site
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREV: ${{ steps.tag.outputs.prev }}
        run: |
          fields=(-f "tag_name=$TAG" -f "target_commitish=$GITHUB_SHA")
          if [ -n "$PREV" ]; then fields+=(-f "previous_tag_name=$PREV"); fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${fields[@]}" > "$RUNNER_TEMP/release-notes.json"
          jq --arg tag "$TAG" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag: $tag, url: $url, date: $date, items: [(.body | split("\n")[] | select(startswith("* ")) | ltrimstr("* ") | select(startswith("Release:") | not) | sub(" by @[^ ]+ in .*$"; ""))]}' \
            "$RUNNER_TEMP/release-notes.json" > src/_data/release.json
          delim="NOTES_$(openssl rand -hex 16)"
          { echo "notes<<$delim"; jq -r .body "$RUNNER_TEMP/release-notes.json"; echo "$delim"; } >> "$GITHUB_OUTPUT"
      - name: Fetch the live sitemap
        run: curl -fsSL --max-time 60 https://mentria.ai/sitemap.xml -o "$RUNNER_TEMP/sitemap-prev.xml" || rm -f "$RUNNER_TEMP/sitemap-prev.xml"
      - name: Build site
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: npm run build
      - name: Check built scripts and internal links
        run: node .github/scripts/check-build.mjs build
      - name: List new and changed pages for search engines
        id: changed
        run: |
          node .github/scripts/indexnow-urls.mjs "$RUNNER_TEMP/sitemap-prev.xml" build/sitemap.xml "$RUNNER_TEMP/indexnow-urls.txt"
          echo "key=$(jq -r '.indexNowKey // empty' src/_data/site.json)" >> "$GITHUB_OUTPUT"
      - name: Keep the changed-page list
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: ${{ runner.temp }}/indexnow-urls.txt
          if-no-files-found: ignore
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Retry deploy
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

  release:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          NOTES: ${{ needs.build.outputs.notes }}
        run: |
          printf '%s' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Fetch the changed-page list
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: indexnow-urls
          path: ${{ runner.temp }}/indexnow
      - name: Tell search engines about new and changed pages
        continue-on-error: true
        env:
          KEY: ${{ needs.build.outputs.indexnow_key }}
        run: |
          list="$RUNNER_TEMP/indexnow/indexnow-urls.txt"
          if [ -z "$KEY" ] || [ ! -s "$list" ]; then echo "Nothing to send."; exit 0; fi
          jq -R -s --arg key "$KEY" '{host: "mentria.ai", key: $key, keyLocation: ("https://mentria.ai/" + $key + ".txt"), urlList: (split("\n") | map(select(length > 0)))}' "$list" > "$RUNNER_TEMP/indexnow.json"
          echo "Sending $(jq '.urlList | length' "$RUNNER_TEMP/indexnow.json") URL(s)."
          curl -sS -o /dev/null -w "IndexNow answered %{http_code}\n" --max-time 60 -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @"$RUNNER_TEMP/indexnow.json"
