name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Check built scripts and internal links
        run: node .github/scripts/check-build.mjs build
