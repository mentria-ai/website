        h('span', { class: 'tx' }, [leftName(p), h('small', { text: t('leftN', { n: p.n }) })]),
        h('button', { type: 'button', class: 'btn', text: t('planIt'), onclick: function () { openPlanLeftover(p); } }),
        h('button', { type: 'button', class: 'ib', 'aria-label': t('removeItem', { name: leftName(p) }), text: '×', onclick: function () { savePantry(S.pantry.filter(function (x) { return x.id !== p.id; })); pendingKey = 'add-left'; render(); } })
      ]));
    });
    var items = S.pantry.filter(function (p) { return !p.lo && FBY[p.f]; }).sort(function (a, b) { return collator.compare(fName(FBY[a.f]), fName(FBY[b.f])); });
    root.appendChild(h('div', { class: 'h' }, [h('h2', { text: t('inPantry') }), h('button', { type: 'button', class: 'btn', 'data-k': 'add-pan', text: '+ ' + t('addPantry'), onclick: function () { pickFood('', function (fid) { openPantryItem({ id: uid(), f: fid }); }); } })]));
    if (!items.length) root.appendChild(h('p', { class: 'muted small', text: t('pantryEmpty') }));
    items.forEach(function (p) {
      var f = FBY[p.f];
      var soon = h('input', { type: 'checkbox', checked: !!p.soon, 'data-k': 'soon-' + p.id, onchange: function () {
        var next = S.pantry.map(function (x) { return x.id === p.id ? Object.assign({}, x, { soon: soon.checked ? 1 : undefined }) : x; });
        if (!savePantry(next)) soon.checked = !soon.checked; else render();
      } });
      root.appendChild(h('div', { class: 'pl' }, [
        h('span', { class: 'tx' }, [fName(f), h('small', { text: p.q ? fmtQty(p.q, p.u) : t('inStock') })]),
        h('label', { class: 'tg' }, [soon, t('useSoon')]),
        h('button', { type: 'button', class: 'ib', 'aria-label': t('editItem', { name: fName(f) }), text: '✎', onclick: function () { openPantryItem(p); } }),
        h('button', { type: 'button', class: 'ib', 'aria-label': t('removeItem', { name: fName(f) }), text: '×', onclick: function () { savePantry(S.pantry.filter(function (x) { return x.id !== p.id; })); pendingKey = 'add-pan'; render(); } })
      ]));
    });
    setTimeout(focusKeyed, 0);
    return root;
  }
  function useUpIdeas() {
    var soon = {}, have = {};
    S.pantry.forEach(function (p) { if (p.f) { have[p.f] = 1; if (p.soon) soon[p.f] = 1; } });
    if (!Object.keys(soon).length) return [];
    var out = [];
    allRecipes().forEach(function (r) {
      if (!fits(r)) return;
      var hit = [], other = 0;
      r.ing.forEach(function (x) {
        if (!x[2]) return;
        if (soon[x[2]]) { if (hit.indexOf(x[2]) < 0) hit.push(x[2]); }
        else if (have[x[2]]) other++;
      });
      if (hit.length) out.push({ r: r, hit: hit, score: hit.length * 10 + other });
    });
    out.sort(function (a, b) { return b.score - a.score || collator.compare(rName(a.r), rName(b.r)); });
    return out.slice(0, 4);
  }
  function openPantryItem(p) {
    var f = FBY[p.f];
    if (!f) return;
    var b = openDialog(fName(f), function () { render(); });
    var qIn = h('input', { type: 'text', inputmode: 'decimal', value: p.q ? String(p.q) : '', 'aria-describedby': 'pq-help' });
    var uSel = h('select', { 'aria-label': t('unit') }, UNITS.filter(function (u) { return u !== 'taste' && u !== 'pinch'; }).map(function (u) { return h('option', { value: u, text: t('un_' + u) }); }));
    uSel.value = p.u || (f.pc ? 'pc' : 'g');
    var soon = h('input', { type: 'checkbox', checked: !!p.soon });
    b.appendChild(h('label', { class: 'f' }, [h('span', { id: 'pq-help', text: t('qtyOpt') }), h('div', { class: 'qr', style: 'display:grid;grid-template-columns:1fr 1.3fr;gap:8px' }, [qIn, uSel])]));
    b.appendChild(h('label', { class: 'opt' }, [soon, h('span', null, [h('b', { text: t('useSoon') })])]));
    b.appendChild(h('div', { class: 'row end', style: 'margin-top:12px' }, [
      h('button', { type: 'button', class: 'btn', text: t('cancel'), onclick: closeDialog }),
      h('button', { type: 'button', class: 'btn pri', text: t('save'), onclick: function () {
        var q = pnum(qIn.value.replace(/[^\d.,/ ]/g, ''));
        var item = { id: p.id, f: p.f };
        if (q > 0) { item.q = q; item.u = uSel.value; }
        if (soon.checked) item.soon = 1;
        var exists = S.pantry.some(function (x) { return x.id === p.id; });
        var next = exists ? S.pantry.map(function (x) { return x.id === p.id ? item : x; }) : S.pantry.filter(function (x) { return x.f !== p.f || x.lo; }).concat([item]);
        if (savePantry(next)) { pendingKey = 'add-pan'; closeDialog(); }
      } })
    ]));
    setTimeout(function () { qIn.focus(); }, 30);
  }
  function openAddLeftover() {
    var b = openDialog(t('addLeft'), function () { render(); });
    var n = 2;
    var opts = [h('option', { value: '', text: '—' })].concat(sortRecipes(allRecipes()).map(function (r) { return h('option', { value: r.id, text: rName(r) }); }));
    var sel = h('select', { 'aria-label': t('secRecipes') }, opts);
    var txt = h('input', { type: 'text', placeholder: t('leftDishPh'), maxlength: '80' });
    b.appendChild(h('label', { class: 'f' }, [h('span', { text: t('secRecipes') }), sel]));
    b.appendChild(h('label', { class: 'f' }, [h('span', { text: t('leftDish') }), txt]));
    b.appendChild(h('div', { class: 'prow sv' }, [h('span', { class: 'lbl', text: t('servings') }), stepper(n, 1, 20, function (v) { n = v; }, t('servings'))]));
    b.appendChild(h('div', { class: 'row end', style: 'margin-top:12px' }, [
      h('button', { type: 'button', class: 'btn', text: t('cancel'), onclick: closeDialog }),
      h('button', { type: 'button', class: 'btn pri', text: t('add'), onclick: function () {
        var item = { id: uid(), lo: 1, n: n };
        if (sel.value) item.r = sel.value;
        else if (txt.value.trim()) item.t = txt.value.trim().slice(0, 80);
        else { txt.focus(); return; }
        if (savePantry(S.pantry.concat([item]))) { pendingKey = 'add-left'; closeDialog(); }
      } })
    ]));
    setTimeout(function () { sel.focus(); }, 30);
  }
  function openPlanLeftover(p) {
    var b = openDialog(t('planIt') + ' · ' + leftName(p), function () { render(); });
    var w = S.week, mon = weekMonday(w), n = Math.min(p.n, S.set.servings);
    var daySel = h('select', { 'aria-label': t('day') }, [0, 1, 2, 3, 4, 5, 6].map(function (i) { return h('option', { value: String(i), text: DFday.format(addDays(mon, i)) }); }));
    daySel.value = String(w === weekNow() ? todayIndex() : 0);
    var slotSel = h('select', { 'aria-label': t('meal') }, SLOTS.map(function (s, i) { return h('option', { value: String(i), text: t('slot_' + s) }); }));
    slotSel.value = '1';
    b.appendChild(h('p', { class: 'muted small', text: t('weekN', { n: weekNum(w) }) + ' · ' + weekRange(w) }));
    b.appendChild(h('label', { class: 'f' }, [h('span', { text: t('day') }), daySel]));
    b.appendChild(h('label', { class: 'f' }, [h('span', { text: t('meal') }), slotSel]));
    b.appendChild(h('div', { class: 'prow sv' }, [h('span', { class: 'lbl', text: t('servings') }), stepper(n, 1, Math.max(1, Math.ceil(p.n)), function (v) { n = v; }, t('servings'))]));
    b.appendChild(h('div', { class: 'row end', style: 'margin-top:12px' }, [
      h('button', { type: 'button', class: 'btn', text: t('cancel'), onclick: closeDialog }),
      h('button', { type: 'button', class: 'btn pri', text: t('add'), onclick: function () {
        var d = +daySel.value, s = +slotSel.value, pl = clone(getPlan(w));
        pl.d[d][s].push(cleanItem({ t: t('leftoverOf', { name: leftName(p) }), n: n }));
        if (savePlan(w, pl)) { useLeftover(p.id, n); hostNotify(t('planned', { slot: t('slot_' + SLOTS[s]), day: DFday.format(addDays(mon, d)) })); closeDialog(); }
      } })
    ]));
  }

  function viewMore() {
    var root = h('section', { class: 'more', 'aria-labelledby': 'set-title' });
    root.appendChild(h('div', { class: 'h' }, [h('h2', { id: 'set-title', text: t('settings') })]));
    var s = S.set;
    function upd(patch) {
      var next = Object.assign({}, S.set, patch);
      if (saveSettings(next)) { render(); updateWidget(); }
      else render();
    }
    root.appendChild(h('div', { class: 'prow sv', style: 'margin:6px 0 4px' }, [h('span', { class: 'lbl', text: t('household') }), stepper(s.servings, 1, 20, function (v) { upd({ servings: v }); }, t('household'), 'hh')]));
    var dietFs = h('fieldset', { class: 'fs' }, [h('legend', { text: t('diet') })]);
    [['any', t('dietAny'), t('dietAnyD')], ['vegetarian', t('p_vegetarian'), t('p_vegetarianD')], ['eggetarian', t('p_eggetarian'), t('p_eggetarianD')], ['vegan', t('p_vegan'), t('p_veganD')]].forEach(function (o) {
      dietFs.appendChild(h('label', { class: 'opt' }, [
        h('input', { type: 'radio', name: 'diet', value: o[0], checked: s.diet === o[0], 'data-k': 'diet-' + o[0], onchange: function () { upd({ diet: o[0] }); } }),
        h('span', null, [h('b', { text: o[1] }), h('small', { text: o[2] })])
      ]));
    });
    root.appendChild(dietFs);
    var freeFs = h('fieldset', { class: 'fs' }, [h('legend', { text: t('avoid') })]);
    FREE.forEach(function (k) {
      freeFs.appendChild(h('label', { class: 'opt' }, [
        h('input', { type: 'checkbox', checked: s.free.indexOf(k) >= 0, 'data-k': 'free-' + k, onchange: function (e) {
          var list = S.set.free.filter(function (x) { return x !== k; });
          if (e.target.checked) list.push(k);
          upd({ free: FREE.filter(function (x) { return list.indexOf(x) >= 0; }) });
        } }),
        h('span', null, [h('b', { text: t('f_' + k) }), h('small', { text: t('f_' + k + 'D') })])
      ]));
    });
    root.appendChild(freeFs);
    root.appendChild(h('p', { class: 'muted small', text: t('presetsHelp') }));
    var cupSel = h('select', { 'data-k': 'cup', onchange: function () { upd({ cup: +cupSel.value }); } }, [
      h('option', { value: '0', text: t('cupAuto', { n: L === 'ja' ? 200 : 240 }) }), h('option', { value: '240', text: t('cup240') }), h('option', { value: '250', text: t('cup250') }), h('option', { value: '200', text: t('cup200') })
    ]);
    cupSel.value = String(s.cup || 0);
    root.appendChild(h('label', { class: 'f' }, [h('span', { text: t('cupSize') }), cupSel]));
    root.appendChild(h('div', { class: 'h' }, [h('h2', { text: t('about') })]));
    var about = h('div', { class: 'box about' }, [h('p', { text: t('aboutBody') }), h('p', { text: t('aboutData') }), h('p', { text: t('aboutPrivacy') }), h('p', { text: t('aboutNoAi') })]);
    if (META) about.appendChild(h('p', { class: 'muted small', text: t('dataset', { n: META.n, v: META.v, date: META.date }) }));
    root.appendChild(about);
    return root;
  }

  function reloadFromStore() {
    S.set = loadSettings();
    S.pantry = loadPantry();
    S.mine = loadMine();
    planCache = {};
    listCache = {};
    if (S.sub && S.sub.type === 'recipe' && !getRecipe(S.sub.id)) S.sub = null;
    render();
    if (sget('today') != null) updateWidget();
    else lastSnap = '';
  }
  var reloadTimer = null;
  window.addEventListener('storage', function (e) {
    if (!e.key || e.key.indexOf(NS_PREFIX) !== 0) return;
    if (Object.prototype.hasOwnProperty.call(own, e.key) && own[e.key] === e.newValue) return;
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(function () {
      if (dlgEl.open || (S.sub && (S.sub.type === 'edit' || S.sub.type === 'paste'))) { S.dirty = true; return; }
      reloadFromStore();
    }, 250);
  });

  if (typeof m.onLocaleChange === 'function') m.onLocaleChange(function (code) {
    setLocale(code);
    lastSnap = '';
    if (dlgEl.open) closeDialog();
    render();
    updateWidget();
  });

  setLocale(m.locale || document.documentElement.lang || navigator.language);
  render();
  updateWidget();
  function scrollToToday() {
    var card = viewEl.querySelector('.day.today'), top = document.querySelector('.top');
    if (!card) return;
    var r = card.getBoundingClientRect(), off = top ? top.getBoundingClientRect().height : 0;
    if (r.top >= off && r.bottom <= window.innerHeight) return;
    window.scrollTo(0, Math.max(0, window.scrollY + r.top - off - 8));
  }
  setTimeout(scrollToToday, 60);
  function netJson(u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }); }
  function keptJson(u) {
    try {
      return caches.match(u).then(function (r) { if (!r) throw new Error('not cached'); return r.json(); });
    } catch (e) {
      return Promise.reject(e);
    }
  }
  function loadJson(names) {
    var urls = names.map(function (n) { return BASE + n; });
    function net() { return Promise.all(urls.map(netJson)); }
    function kept() { return Promise.all(urls.map(keptJson)); }
    if (navigator.onLine === false) return kept().catch(net);
    return net().catch(function (err) { return kept().catch(function () { throw err; }); });
  }
  loadJson(['foods.json', 'recipes.json']).then(function (res) {
    initFoods(res[0]);
    initStarters(res[1]);
    S.ready = true;
    clearErr('load');
    if (!dlgEl.open) render();
    lastSnap = '';
    updateWidget();
    loadJson(['synonyms.json']).then(function (r) { initSynonyms(r[0]); }, function () {});
  }).catch(function () {
    S.failed = true;
    showErr(t('loadFail'), 'load');
    if (!dlgEl.open) render();
  });
})();
