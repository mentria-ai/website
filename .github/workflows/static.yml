name: Deploy Static Content to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - '.eleventy.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/static.yml'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Tag the release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="v$(date -u +%Y.%m.%d)"
          tag="$base"; n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do n=$((n+1)); tag="$base-$n"; done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.tag.outputs.tag }}" --target "$GITHUB_SHA" --generate-notes --title "${{ steps.tag.outputs.tag }}"
      - name: Capture the release notes for the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ steps.tag.outputs.tag }}" --json tagName,url,publishedAt,body --jq '{tag: .tagName, url: .url, date: .publishedAt, items: [(.body | split("\n")[] | select(startswith("* ")) | ltrimstr("* ") | sub(" by @[^ ]+ in .*$"; ""))]}' > src/_data/release.json
      - name: Build site
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: npm run build
      - name: Check built scripts and internal links
        run: node .github/scripts/check-build.mjs build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry deploy
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
