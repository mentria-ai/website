name: Publish approved story submission

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: story-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.label.name == 'story-approved' && contains(github.event.issue.labels.*.name, 'story-submission')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      story_id: ${{ steps.prepare.outputs.story_id }}
      title: ${{ steps.prepare.outputs.title }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the image encoder from its lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/story
      - name: Build the story from the issue
        id: prepare
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PENDING_IDS="$(git ls-remote --heads origin 'story/*' | sed 's|.*refs/heads/story/||')"
          export PENDING_IDS
          node scripts/story/prepare.mjs "$RUNNER_TEMP/story"
      - uses: actions/upload-artifact@v4
        with:
          name: story-${{ steps.prepare.outputs.story_id }}
          path: ${{ runner.temp }}/story
          retention-days: 90
          if-no-files-found: error

  pr:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      url: ${{ steps.pr.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: story-${{ needs.prepare.outputs.story_id }}
          path: ${{ runner.temp }}/story
      - name: Add the story to a branch
        env:
          STORY_ID: ${{ needs.prepare.outputs.story_id }}
          STORY_TITLE: ${{ needs.prepare.outputs.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node scripts/story/apply.mjs "$RUNNER_TEMP/story"
          git config user.name "mentria-bot"
          git config user.email "agent@mentria.ai"
          git switch -c "story/$STORY_ID"
          git add src/_data/stories.json src/_data/feed.json
          git commit -m "stories: $STORY_TITLE (#$ISSUE_NUMBER)"
          git push origin "story/$STORY_ID"
      - name: Open a pull request to develop
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          STORY_ID: ${{ needs.prepare.outputs.story_id }}
          STORY_TITLE: ${{ needs.prepare.outputs.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/story/pr-body.mjs "$RUNNER_TEMP/story" > "$RUNNER_TEMP/body.md"
          url=$(gh pr create --base develop --head "story/$STORY_ID" --title "Community story: $STORY_TITLE" --body-file "$RUNNER_TEMP/body.md")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Remove the branch when no pull request was opened
        if: failure() && steps.pr.outputs.url == ''
        env:
          STORY_ID: ${{ needs.prepare.outputs.story_id }}
        run: git push origin --delete "story/$STORY_ID" || true

  notify:
    needs: [prepare, pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ needs.pr.outputs.url }}
          STORY_ID: ${{ needs.prepare.outputs.story_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Approved. The story is in $PR_URL. Once it's merged, it goes live with the next release at https://mentria.ai/feed/story/$STORY_ID/"
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label story-published
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"

  failed:
    needs: [prepare, pr]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report the failure on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Publishing failed. See the workflow run: $RUN_URL. Check the issue body: one image per slide, uploaded to the issue itself, plain text without HTML, and valid story JSON. Then add the story-approved label again."
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label story-approved

  rejected:
    if: github.event.label.name == 'story-rejected' && contains(github.event.issue.labels.*.name, 'story-submission')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Thanks for submitting — this one won't be published."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
