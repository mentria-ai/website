<script type="module">
import * as THREE from 'three';

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  window.__mentriaNoContext = String((e && e.message) || e);
}
if (renderer) {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);
  if (!renderer.getContext()) window.__mentriaNoContext = 'getContext() returned null';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 400);
const timer = new THREE.Timer();
Object.assign(window, { THREE, scene, camera, renderer, timer });

let composer = null;
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (renderer) renderer.setSize(w, h);
  if (composer) composer.setSize(w, h);

window.addEventListener('resize', resize);

let body = null;
function renderAt(t) {
  if (body && typeof body.update === 'function') body.update(t);
  if (composer) composer.render();
  else if (renderer) renderer.render(scene, camera);
}
function renderSceneAt(t) {
  if (body && typeof body.update === 'function') body.update(t);
  if (!renderer) return;
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
}

let looping = false;
function tick(ts) {
  timer.update(ts);
  renderAt(timer.getElapsed());
}
function start() {
  if (looping || !renderer) return;
  looping = true;
  renderer.setAnimationLoop(tick);
}
function stop() {
  looping = false;
  if (renderer) renderer.setAnimationLoop(null);

async function loadBody(url) {
  const out = { ok: false, hasUpdate: false, hasComposer: false, exports: [], error: null };
  try {
    body = await import(/* @vite-ignore */ url);
    out.exports = Object.keys(body);

    out.error = String((e && e.message) || e).slice(0, 400);
  }
  window.__body = out;
  return out;

function sample() {
  const gl = renderer.getContext();
  const c = renderer.domElement;
  const w = c.width, h = c.height;
  const raw = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, raw);
  const n = Math.floor((w * h) / 7);
  const s = new Uint8Array(n * 3);
  for (let i = 0; i < n; i++) {
    const p = i * 7 * 4;
    s[i * 3] = raw[p]; s[i * 3 + 1] = raw[p + 1]; s[i * 3 + 2] = raw[p + 2];

  return s;
}
function frameStats(s) {
  const n = s.length / 3;
  const lum = new Float64Array(n);
  const seen = new Set();
  let ink = 0, mean = 0;
  for (let i = 0; i < n; i++) {
    const r = s[i * 3], g = s[i * 3 + 1], b = s[i * 3 + 2];
    const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    lum[i] = l; mean += l;
    if (r > 8 || g > 8 || b > 8) ink++;

  mean /= n;
  let v = 0;
  for (let i = 0; i < n; i++) { const d = lum[i] - mean; v += d * d; }
  return { lumStd: Math.sqrt(v / n), lumMean: mean, colours15bit: seen.size, inkFrac: ink / n, samples: n };
}
function delta(a, b) {
  let acc = 0;
  for (let i = 0; i < a.length; i++) acc += Math.abs(a[i] - b[i]);
  return acc / a.length;
}
function graph() {
  let lights = 0, meshes = 0, objects = 0;
  scene.traverse((o) => { objects++; if (o.isLight) lights++; if (o.isMesh) meshes++; });
  return {
    objects, lights, meshes,
    hasBackground: !!scene.background, hasFog: !!scene.fog,
    camDist: camera.position.length(),
    composerPasses: composer ? composer.passes.length : 0,
    canvases: document.querySelectorAll('canvas').length

}

function stats() {
  if (window.__mentriaNoContext) return { noContext: window.__mentriaNoContext, errors: window.__mentriaErrors.slice() };
  stop();
  let s0, s1, s6, d1, d2, thrown = null;
  try {
    renderAt(0); s0 = sample();
    renderAt(0.9); s1 = sample();
    renderAt(6); s6 = sample();
    renderSceneAt(0.9); d1 = sample();

    out.animMid = delta(s1, s6);
    out.animDelta = Math.max(out.animShort, out.animLong, out.animMid);

function reply(msg) { try { parent.postMessage(Object.assign({ source: 'mentria-forge-frame' }, msg), '*'); } catch (e) {} }

window.addEventListener('message', async (e) => {
  const m = e.data;
  if (!m || m.source !== 'mentria-forge' || m.type !== 'load' || typeof m.body !== 'string') return;

  reply({ type: 'result', id: m.id, loaded, stats: result, errors: window.__mentriaErrors.slice() });
