<script type="module">
import { SimplePool, generateSecretKey, getPublicKey, finalizeEvent } from '/assets/vendor/nostr-tools.js';

const KIND = 20808;
const RELAY = 'wss://relay.mentria.ai';
const SERVICE = 'mentria-imagegen-v1';
const ISSUE_URL = 'https://github.com/mentria-ai/website/issues/new';
const URL_BODY_BUDGET = 5200;
const m = window.mentria || {};
const store = m.storage;

const te = new TextEncoder(), td = new TextDecoder();
const toB64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const hx = (u8) => [...u8].map((b) => b.toString(16).padStart(2, '0')).join('');

async function deriveKey(secret) {
  const raw = await crypto.subtle.digest('SHA-256', te.encode('mentria-imagegen:key:' + secret));
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
}
async function deriveChannel(secret) {
  return hx(new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode('mentria-imagegen:chan:' + secret))));
}
async function seal(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj))));
  const ct = enc.subarray(0, enc.length - 16), tag = enc.subarray(enc.length - 16);
  const out = new Uint8Array(28 + ct.length);
  out.set(iv, 0); out.set(tag, 12); out.set(ct, 28);
  return toB64(out);
}
async function open(key, b64) {
  const buf = fromB64(b64);
  const iv = buf.subarray(0, 12), tag = buf.subarray(12, 28), ct = buf.subarray(28);
  const cw = new Uint8Array(ct.length + 16);
  cw.set(ct, 0); cw.set(tag, ct.length);
  return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cw)));
}

class Room {
  constructor(relay, secret) { this.relays = [relay]; this.secret = secret; this.pool = new SimplePool(); this.sk = generateSecretKey(); this.pk = getPublicKey(this.sk); this.pending = new Map(); this.onPush = null; }
  async start() {
    this.key = await deriveKey(this.secret);
    this.channel = await deriveChannel(this.secret);
    this.sub = this.pool.subscribeMany(this.relays, { kinds: [KIND], '#t': [this.channel], since: Math.floor(Date.now() / 1000) - 5 }, { onevent: (ev) => this._ev(ev) });
  }
  async _ev(ev) {
    if (ev.pubkey === this.pk) return;
    let msg; try { msg = await open(this.key, ev.content); } catch { return; }
    const role = ev.tags.find((t) => t[0] === 'role')?.[1];
    if (role !== 'res') return;
    if (msg.id && this.pending.has(msg.id)) {
      const p = this.pending.get(msg.id); clearTimeout(p.to); this.pending.delete(msg.id);
      msg.ok ? p.resolve(msg.data) : p.reject(new Error(msg.error?.message || 'request failed'));
    } else if (msg.event && this.onPush) { this.onPush(msg.event, msg.data); }
  }
  request(op, params = {}, timeoutMs = 20000) {
    const id = hx(crypto.getRandomValues(new Uint8Array(8)));
    return new Promise((resolve, reject) => {
      const to = setTimeout(() => { this.pending.delete(id); reject(new Error('timeout: ' + op)); }, timeoutMs);
      this.pending.set(id, { resolve, reject, to });
      this._send('req', { id, op, params });
    });
  }
  async _send(role, obj) {
    const ev = finalizeEvent({ kind: KIND, created_at: Math.floor(Date.now() / 1000), tags: [['t', this.channel], ['role', role], ['expiration', String(Math.floor(Date.now() / 1000) + 600)]], content: await seal(this.key, obj) }, this.sk);
    for (const p of this.pool.publish(this.relays, ev)) Promise.resolve(p).catch(() => {});
  }
}

const idb = await new Promise((resolve, reject) => {
  const req = indexedDB.open('mentria-ext-story-studio', 1);
  req.onupgradeneeded = () => req.result.createObjectStore('images');
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
const idbPut = (k, blob) => new Promise((res, rej) => { const t = idb.transaction('images', 'readwrite'); t.objectStore('images').put(blob, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
const idbGet = (k) => new Promise((res, rej) => { const r = idb.transaction('images').objectStore('images').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); });
const idbDel = (k) => new Promise((res) => { const t = idb.transaction('images', 'readwrite'); t.objectStore('images').delete(k); t.oncomplete = res; t.onerror = res; });

const $ = (id) => document.getElementById(id);
const uid = () => hx(crypto.getRandomValues(new Uint8Array(5)));

let decks = store.get('decks') || [];
const saveDecks = () => store.set('decks', decks);

import('/assets/js/mentria-bus.js').then(({ MentriaBus }) => {
  MentriaBus.provide('studio.createDeck', (p) => {
    const o = p || {};
    const title = String(o.title || '').trim().slice(0, 60);
    if (!title) throw new Error('title is required');
    const rawSlides = Array.isArray(o.slides) ? o.slides : [];
    if (!rawSlides.length || rawSlides.length > 12) throw new Error('need 1-12 slides, each with a caption');
    const slides = rawSlides.map((slRaw) => {
      const sl = typeof slRaw === 'string' ? { caption: slRaw } : slRaw;
      const caption = String((sl && sl.caption) || '').trim().slice(0, 200);
      if (!caption) throw new Error('every slide needs a caption — send slides as [{"caption":"..."}] or plain strings');
      const out = { id: uid(), caption };
      const prompt = String((sl && sl.prompt) || '').trim().slice(0, 300);
      if (prompt) out.prompt = prompt;
      const lp = String((sl && sl.long_press) || '').trim().slice(0, 600);
      if (lp) out.long_press = lp;
      return out;
    });
    const d = { id: uid(), title, subtitle: String(o.subtitle || '').trim().slice(0, 140), slides, updated: Date.now() };
    decks.unshift(d);
    saveDecks();
    try { renderList(); openDeck(d.id); } catch (_) {}
    return { ok: true, id: d.id, title: d.title, slides: slides.length, note: 'draft created in Story Studio; images can be generated there' };
  }, { description: 'Create a new story deck draft in Story Studio from a title and slide captions. Each slide: caption (required, the on-screen text), prompt (optional image description), long_press (optional deeper note). Images are generated afterwards in the studio.', parameters: { type: 'object', properties: { title: { type: 'string' }, subtitle: { type: 'string' }, slides: { type: 'array', items: { type: 'object', properties: { caption: { type: 'string' }, prompt: { type: 'string' }, long_press: { type: 'string' } }, required: ['caption'] } } }, required: ['title', 'slides'] }, ai: true });
  MentriaBus.provide('studio.listDecks', () => decks.map((d) => ({ id: d.id, title: d.title, slides: d.slides.length, updated: d.updated })), { description: 'List the story decks saved in Story Studio.', parameters: { type: 'object', properties: {} }, ai: true, readonly: true });
}).catch(() => {});
let cur = null;
let online = false;
let genBusy = false;
const urls = new Map();

async function thumbUrl(key) {
  if (urls.has(key)) return urls.get(key);
  const blob = await idbGet(key);
  if (!blob) return null;
  const u = URL.createObjectURL(blob);
  urls.set(key, u);
  return u;
}
function dropUrl(key) {
  if (urls.has(key)) { URL.revokeObjectURL(urls.get(key)); urls.delete(key); }
}

const room = new Room(RELAY, SERVICE);
let myJob = null;
let chunks = null;
let genSlide = null;

let LORAS = [];
function paintLoras(list) {
  LORAS = Array.isArray(list) ? list : [];
  const sel = $('lora');
  const keep = sel.value;
  sel.innerHTML = '<option value="">Default (photoreal)</option>';
  for (const l of LORAS) { const o = document.createElement('option'); o.value = l.id; o.textContent = l.label; sel.appendChild(o); }
  if (LORAS.some((l) => l.id === keep)) sel.value = keep;
  $('stylerow').hidden = LORAS.length === 0;
  paintLoraHint();
}
function paintLoraHint() {
  const l = LORAS.find((x) => x.id === $('lora').value);
  $('lorahint').textContent = l ? (l.trigger ? 'adds “' + l.trigger + '” to the prompt automatically' : 'style applied automatically') : '';
}
$('lora').addEventListener('change', () => { paintLoraHint(); if (cur) { cur.lora = $('lora').value; touch(); } });

function setOnline(on, info) {
  online = on;
  if (on) paintLoras(info.loras);
  for (const [d, s] of [[$('dot'), $('svc')], [$('dot2'), $('svc2')]]) {
    d.className = 'dot ' + (on ? 'on' : 'off');
    s.textContent = on ? 'render node: ' + (info.model || 'ready') + (info.queue ? ' · ' + info.queue + ' in queue' : '') : 'render node offline — import still works';
  }
  document.querySelectorAll('.gen-btn').forEach((b) => { b.disabled = !on || genBusy; });
}
async function hello() {
  try {
    const info = await room.request('hello', {}, 8000);
    setOnline(!!info.ready, info);
  } catch { setOnline(false, {}); }
}

room.onPush = (event, data) => {
  if (!myJob || !data || data.job !== myJob) return;
  const slide = genSlide;
  if (!slide) return;
  const st = document.querySelector('[data-genstate="' + slide.id + '"]');
  if (event === 'job:pos') {
    if (st) st.textContent = 'queue position ' + data.pos + ' · ~' + Math.round(data.etaMs / 1000) + 's';
  } else if (event === 'job:start') {
    if (st) st.textContent = 'rendering… ~' + Math.round((data.etaMs || 40000) / 1000) + 's';
  } else if (event === 'job:done') {
    chunks = { mime: data.mime, total: data.chunks, got: 0, parts: new Array(data.chunks) };
    if (st) st.textContent = 'receiving image…';
  } else if (event === 'job:chunk' && chunks) {
    if (!chunks.parts[data.i]) { chunks.parts[data.i] = fromB64(data.b64); chunks.got++; }
    if (st) st.textContent = 'receiving ' + Math.round((chunks.got / chunks.total) * 100) + '%';
    if (chunks.got === chunks.total) finishGen(slide);
  } else if (event === 'job:error') {
    if (st) { st.textContent = data.message || 'generation failed'; st.className = 'genstate err'; }
    myJob = null; chunks = null; genSlide = null; genBusy = false;
    setOnline(online, {});
  }
};

async function finishGen(slide) {
  const blob = new Blob(chunks.parts, { type: chunks.mime });
  const key = cur.id + '/' + slide.id;
  dropUrl(key);
  await idbPut(key, blob);
  slide.hasImage = true;
  slide.source = 'generated';
  touch();
  myJob = null; chunks = null; genSlide = null; genBusy = false;
  renderSlides();
  setOnline(online, {});
}

async function generateFor(slide, prompt, stateEl) {
  if (genBusy || !prompt.trim()) return;
  genBusy = true;
  document.querySelectorAll('.gen-btn').forEach((b) => { b.disabled = true; });
  stateEl.className = 'genstate';
  stateEl.textContent = 'submitting…';
  try {
    const r = await room.request('generate', $('lora').value ? { prompt: prompt.trim(), lora: $('lora').value } : { prompt: prompt.trim() }, 15000);
    myJob = r.job;
    genSlide = slide;
    stateEl.textContent = 'queue position ' + r.pos + ' · ~' + Math.round(r.etaMs / 1000) + 's';
  } catch (e) {
    stateEl.className = 'genstate err';
    stateEl.textContent = String(e.message || e);
    genBusy = false;
    setOnline(online, {});
    if (/timeout/.test(String(e.message))) setOnline(false, {});
  }
}

function touch() {
  cur.updated = Date.now();
  saveDecks();
}

function confirmBtn(label, fn) {
  const wrap = document.createElement('span');
  wrap.className = 'confirmwrap';
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'mini btn--danger'; b.textContent = label;
  b.addEventListener('click', () => {
    if (b.dataset.armed) { fn(); return; }
    b.dataset.armed = '1';
    b.textContent = 'sure?';

const blobToDataUrl = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });

async function buildBundle() {
  const title = (cur.title || '').trim();
  if (!title) { setStatus('give the story a title first', 'err'); return null; }
  const ready = cur.slides.filter((s) => s.hasImage && (s.caption || '').trim());
  if (!ready.length) { setStatus('need at least one slide with an image and a caption', 'err'); return null; }
  setStatus('packing…');
  const images = {};
  for (const s of ready) {
    const blob = await idbGet(cur.id + '/' + s.id);
    images[s.id] = await blobToDataUrl(blob);
  }
  return {
    missing: cur.slides.length - ready.length,
    ready,
    bundle: {
      format: 'mentria-story-1',
      exported: new Date().toISOString(),
      deck: {
        title,
        subtitle: localized((cur.subtitle || '').trim(), 'subtitle'),
        credit: (cur.credit || '').trim(),
        cover: cur.cover && ready.some((s) => s.id === cur.cover) ? cur.cover : ready[0].id,
        slides: ready.map((s) => ({ id: s.id, caption: localized(s.caption.trim(), s.id + '.caption'), long_press: localized((s.long || '').trim(), s.id + '.long'), source: s.source || 'imported' }))
      },
      images
    }
  };
}

const LANGS = [['es', 'Español'], ['fr', 'Français'], ['ja', '日本語'], ['pt-BR', 'Português (Brasil)']];
const LANG_NAMES = { es: 'Spanish', fr: 'French', ja: 'Japanese', 'pt-BR': 'Brazilian Portuguese' };
let engine = null;
let engineTier = '';
let engineCtx = 2048;
let translating = false;

function tstate(msg, err) {
  const el = $('tstate');
  el.hidden = !msg;
  el.textContent = msg || '';
  el.className = 'tstate' + (err ? ' err' : '');
}

const NOT_SUPPORTED = 'translation is not supported on this device — it needs the 27B on-device model';

async function loadTranslator() {
  if (engine) return engine;
  if (!navigator.gpu) throw new Error(NOT_SUPPORTED);
  const Tiers = await import('/assets/js/mentria-tiers.js');
  const candidate = await Tiers.effectiveTier();
  if (candidate !== '27b') throw new Error(NOT_SUPPORTED);
  tstate('loading the on-device model…');
  const { MentriaEngine } = await import('/assets/mentria/dist/mentria.mjs');
  const { ensureModel } = await import('/assets/js/mentria-model.js');
  const res = await ensureModel(() => {
    const e = new MentriaEngine('/assets/mentria/dist/worker.mjs');
    if (window.mentriaWrapEngine) window.mentriaWrapEngine(e);
    return e;
  }, {
    vision: false,
    offerUpgrade: false,
    onProgress: (p) => {
      if (!p) return;
      const pct = p.loaded != null && p.total > 0 ? ' ' + Math.round(Math.min(1, p.loaded / p.total) * 100) + '%' : '';
      tstate((p.message || 'loading the on-device model…') + pct + (p.total >= 1048576 ? ' · ' + (p.loaded / 1048576 / 1024).toFixed(2) + ' / ' + (p.total / 1048576 / 1024).toFixed(2) + ' GB' : ''));
    },
    onDeviceLost: () => { engine = null; tstate('the GPU device was lost — reload and try again', true); }
  });
  if (res.tier !== '27b') {
    try { res.engine.dispose && res.engine.dispose(); } catch (_) {}
    throw new Error(NOT_SUPPORTED);
  }
  engine = res.engine;
  engineTier = res.tier;
  engineCtx = res.maxSeq || 2048;
  return engine;
}

function systemPromptFor(langName) {
  return 'You are a professional literary translator. The user gives you a JSON object whose values are short English texts from a picture story: a subtitle, slide captions, and longer "long" notes. Translate every value into ' + langName + '.\n'
    + 'Rules:\n'
    + '- Keep exactly the same keys. Translate only the values.\n'
    + '- Preserve meaning, tone, and register. Captions must read naturally in ' + langName + ' and stay about as short as the English.\n'
    + '- Keep names of people, places, and brands. Keep numbers, punctuation style, and line breaks.\n'
    + '- Do not add notes, explanations, quotes, or markdown.\n'
    + 'Respond with only the translated JSON object.';
}

function extractJson(text, keys) {
  const t = text.replace(/<think>[\s\S]*?<\/think>/g, '').replace(/```(?:json)?/g, '').replace(/[\u201c\u201d]/g, '"');
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) {
    let raw = t.slice(a, b + 1);
    try { return JSON.parse(raw); } catch (_) {}
    raw = raw.replace(/,\s*}/g, '}').replace(/"\s*\n\s*"/g, '", "');
    raw = raw.replace(/"((?:[^"\\]|\\.)*)"/g, (m) => m.replace(/\n/g, '\\n'));
    try { return JSON.parse(raw); } catch (_) {}
  }
  const out = {};
  for (const k of keys) {
    const re = new RegExp('"' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '"\s*:\s*"((?:[^"\\]|\\.)*)"');
    const m = re.exec(t);
    if (m) out[k] = m[1].replace(/\\"/g, '"').replace(/\\n/g, '\n');
  }
  if (Object.keys(out).length) return out;
  throw new Error('no JSON in reply');
}

async function translateBatch(fields, lang) {
  const input = JSON.stringify(fields);
  const cjk = lang === 'ja';
  const maxTokens = Math.min(engineCtx >= 4096 ? 1800 : 1000, Math.ceil(input.length / (cjk ? 1 : 2)) + 200);
  for (let attempt = 0; attempt < 2; attempt++) {
    let out = '';
    await engine.generate({
      messages: [
        { role: 'system', content: systemPromptFor(LANG_NAMES[lang]) + (attempt ? '\nThe previous reply was not valid JSON. Return only the JSON object.' : '') },
        { role: 'user', content: input }
      ],
      maxTokens,
      temperature: 0,
      topK: 1,
      topP: 1.0,
      repetitionPenalty: 1.0,
      enableThinking: false
    }, (ev) => { if (typeof ev.token === 'string' && !/^<\|[^|]*\|>$/.test(ev.token)) out += ev.token; });
    window.mentriaTranslateDebug = { lang, raw: out };
    try {
      const obj = extractJson(out, Object.keys(fields));
      const res = {};
      for (const k of Object.keys(fields)) {
        if (typeof obj[k] !== 'string' || !obj[k].trim()) continue;
        const v = obj[k].trim();
        if (lang === 'ja') {
          const jaChars = (v.match(/[\u3040-\u30FF\u4E00-\u9FFF\uFF01-\uFF60]/g) || []).length;
          if (!jaChars || /[A-Za-z]{3,}/.test(v)) continue;
        }
        res[k] = v;
      }
      if (Object.keys(res).length === Object.keys(fields).length) return res;
      if (attempt && Object.keys(res).length) return res;
    } catch (_) {}
  }
  throw new Error('the model did not return usable JSON for ' + LANG_NAMES[lang]);
}

async function askJson(system, user, maxTokens) {
  let out = '';
  await engine.generate({ messages: [{ role: 'system', content: system }, { role: 'user', content: user }], maxTokens, temperature: 0, topK: 1, topP: 1.0, repetitionPenalty: 1.0, enableThinking: false }, (ev) => { if (typeof ev.token === 'string' && !/^<\|[^|]*\|>$/.test(ev.token)) out += ev.token; });
  return out;
}
async function verifyTranslations(fields, draft, lang) {
  const keys = Object.keys(draft);
  if (!keys.length) return draft;
  const name = LANG_NAMES[lang];
  const okJa = (v) => lang !== 'ja' || (/[\u3040-\u30FF\u4E00-\u9FFF]/.test(v) && !/[A-Za-z]{3,}/.test(v));
  let current = Object.assign({}, draft);
  for (let round = 0; round < 2; round++) {
    let backObj;
    try { backObj = extractJson(await askJson('Translate every value of the JSON object from ' + name + ' into plain, literal English. Keep the keys. Reply with only the JSON object.', JSON.stringify(current), Math.min(1400, JSON.stringify(current).length + 200)), Object.keys(current)); } catch (_) { return current; }
    const pairs = {};
    for (const k of Object.keys(current)) if (typeof backObj[k] === 'string') pairs[k] = { original: fields[k], translation_read_back: backObj[k] };
    let verdict;
    try { verdict = extractJson(await askJson('You compare an original English sentence with a literal read-back of its translation. For each key answer "same" if they mean the same thing (small wording differences are fine), or "different: <the specific change in meaning>" if the meaning changed, a word is wrong, or the read-back is broken. Reply with only a JSON object mapping each key to that answer.', JSON.stringify(pairs), Math.min(1200, Object.keys(pairs).length * 60 + 120)), Object.keys(pairs)); } catch (_) { return current; }
    const bad = Object.keys(pairs).filter((k) => typeof verdict[k] === 'string' && /^different/i.test(verdict[k].trim()));
    for (const k of Object.keys(current)) if (!okJa(current[k]) && !bad.includes(k)) bad.push(k);
    if (!bad.length) return current;
    if (round === 1) { for (const k of bad) delete current[k]; return current; }
    const redo = {};
    for (const k of bad) redo[k] = fields[k];
    const notes = bad.map((k) => k + ': ' + String(verdict[k] || 'contains English words').replace(/^different:\s*/i, '')).join('\n');
    try { const fixed = extractJson(await askJson('You are a careful literary translator (English → ' + name + '). A previous translation of these lines changed their meaning. Faithfulness is the only priority: keep every negation, every adjective, every object exactly. Known problems:\n' + notes + '\nReply with only the JSON object mapping each key to the corrected ' + name + ' text.', JSON.stringify(redo), Math.min(1200, JSON.stringify(redo).length * 2 + 200)), bad); for (const k of bad) if (typeof fixed[k] === 'string' && fixed[k].trim()) current[k] = fixed[k].trim(); else delete current[k]; } catch (_) { for (const k of bad) delete current[k]; }
  }
  return current;
}

function deckFields() {
  const f = {};
  if ((cur.subtitle || '').trim()) f.subtitle = cur.subtitle.trim();
  for (const sl of cur.slides) {
    if ((sl.caption || '').trim()) f[sl.id + '.caption'] = sl.caption.trim();
    if ((sl.long || '').trim()) f[sl.id + '.long'] = sl.long.trim();
  }
  return f;
}

function batches(fields) {
  const out = [];
  let curBatch = {}, size = 0;
  const limit = engineCtx >= 4096 ? 1400 : 650;
  for (const [k, v] of Object.entries(fields)) {
    if (size && size + v.length > limit) { out.push(curBatch); curBatch = {}; size = 0; }
    curBatch[k] = v; size += v.length;
  }
  if (Object.keys(curBatch).length) out.push(curBatch);
  return out;
}

async function translateDeck() {
  if (translating) return;
  const fields = deckFields();
  if (!Object.keys(fields).length) { tstate('nothing to translate yet — add a subtitle or captions', true); return; }
  translating = true;
  $('translate').disabled = true;
  try {
    await loadTranslator();
    cur.i18n = cur.i18n || {};
    const parts = batches(fields);
    let done = 0, total = LANGS.length * parts.length;
    const failed = [];
    for (const [lang, label] of LANGS) {
      cur.i18n[lang] = cur.i18n[lang] || {};
      for (const part of parts) {
        tstate('translating to ' + label + '… (' + (done + 1) + '/' + total + ')');
        try {
          const res = await verifyTranslations(part, await translateBatch(part, lang), lang);
          for (const k of Object.keys(part)) delete cur.i18n[lang][k];
          Object.assign(cur.i18n[lang], res);
        } catch (e) {
          if (!failed.includes(label)) failed.push(label);
        }
        done++;
        touch();
        renderTranslations();
      }
    }
    const ok = LANGS.filter((l) => !failed.includes(l[1])).map((l) => l[1]);
    tstate((ok.length ? 'translated into ' + ok.join(', ') + ' — review and edit below' : 'translation failed') + (failed.length ? ' · could not translate: ' + failed.join(', ') + ' (try again)' : ''), !ok.length);
  } catch (e) {
    tstate(String(e.message || e), true);
  }
  translating = false;
  $('translate').disabled = false;
}

function trValue(lang, key) { return cur.i18n && cur.i18n[lang] && cur.i18n[lang][key] || ''; }
function setTr(lang, key, v) { cur.i18n = cur.i18n || {}; cur.i18n[lang] = cur.i18n[lang] || {}; if (v.trim()) cur.i18n[lang][key] = v.trim(); else delete cur.i18n[lang][key]; touch(); }
function hasTranslations() { return !!(cur.i18n && LANGS.some(([l]) => cur.i18n[l] && Object.keys(cur.i18n[l]).length)); }

function trRows(container, keys) {
  container.innerHTML = '';
  for (const [lang, label] of LANGS) {
    for (const [key, ph] of keys) {
      const row = document.createElement('div');
      row.className = 'tr__row';
      const l = document.createElement('span');
      l.className = 'tr__lang';
      l.textContent = label + ' · ' + ph;
      const ta = document.createElement('textarea');
      ta.rows = 1;
      ta.value = trValue(lang, key);
      ta.placeholder = ph;
      ta.addEventListener('change', () => setTr(lang, key, ta.value));
      row.append(l, ta);
      container.appendChild(row);
    }
  }
}

function renderTranslations() {
  const show = hasTranslations();
  $('deck-tr').hidden = !show;
  if (show) trRows($('deck-tr-rows'), [['subtitle', 'subtitle']]);
  document.querySelectorAll('[data-slide-tr]').forEach((det) => {
    det.hidden = !show;
    if (show) trRows(det.querySelector('.tr__rows'), [[det.dataset.slideTr + '.caption', 'caption'], [det.dataset.slideTr + '.long', 'long press']]);
  });
}

function localized(en, key) {
  const v = { en };
  let any = false;
  for (const [lang] of LANGS) { const t = trValue(lang, key); if (t) { v[lang] = t; any = true; } }
  return any ? v : en;
}

$('translate').addEventListener('click', translateDeck);

const crcTable = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = crcTable[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  for (const f of files) {
    const name = enc.encode(f.name);
    const data = f.data;
    const crc = crc32(data);
    const head = new DataView(new ArrayBuffer(30));
    head.setUint32(0, 0x04034b50, true); head.setUint16(4, 20, true); head.setUint16(6, 0x0800, true); head.setUint16(8, 0, true);
    head.setUint16(10, dosTime, true); head.setUint16(12, dosDate, true); head.setUint32(14, crc, true);
    head.setUint32(18, data.length, true); head.setUint32(22, data.length, true); head.setUint16(26, name.length, true); head.setUint16(28, 0, true);
    parts.push(new Uint8Array(head.buffer), name, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true); cd.setUint16(10, 0, true);
    cd.setUint16(12, dosTime, true); cd.setUint16(14, dosDate, true); cd.setUint32(16, crc, true);
    cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true); cd.setUint16(28, name.length, true);
    cd.setUint16(30, 0, true); cd.setUint16(32, 0, true); cd.setUint16(34, 0, true); cd.setUint16(36, 0, true); cd.setUint32(38, 0, true); cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((n, p) => n + p.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(8, files.length, true); eocd.setUint16(10, files.length, true);
  eocd.setUint32(12, cdSize, true); eocd.setUint32(16, offset, true); eocd.setUint16(20, 0, true);

}

function submissionJson(bundle) {
  const d = bundle.deck;
  return {
    format: 'mentria-story-submission-2',
    title: d.title,
    subtitle: d.subtitle,
    credit: d.credit,
    cover: Math.max(0, d.slides.findIndex((s) => s.id === d.cover)) + 1,
    slides: d.slides.map((s) => ({ caption: s.caption, long_press: s.long_press }))
  };
}

function issueBody(sub, withJson) {
  const n = sub.slides.length;
  const lines = [
    '<!-- Story submission for mentria.ai — please keep the structure below -->',
    '**' + sub.title + '**' + (sub.subtitle ? ' — ' + sub.subtitle : ''),
    sub.credit ? 'Credit: ' + sub.credit : '',
    '',
    '### Images',
    'Unzip the download and drag all ' + n + ' image files into the box below **in order** (01, 02, …). GitHub uploads them as you drop them.',
    '',
    '<!-- drop images here -->',
    '',
    '### Story data',
    withJson ? '```json\n' + JSON.stringify(sub) + '\n```' : 'Open `story.json` from the download, copy everything, and paste it here between the fences:\n```json\n\n```'
  ];
  return lines.filter((l) => l !== null).join('\n');
}

$('submit').addEventListener('click', async () => {
  const popup = window.open('about:blank', '_blank');
  const b = await buildBundle();
  if (!b) { if (popup) popup.close(); return; }
  const { bundle, ready } = b;
  const sub = submissionJson(bundle);
  const files = [];
  for (let i = 0; i < ready.length; i++) {
    const blob = await idbGet(cur.id + '/' + ready[i].id);
    const ext = blob.type === 'image/png' ? 'png' : blob.type === 'image/jpeg' ? 'jpg' : 'webp';
    files.push({ name: String(i + 1).padStart(2, '0') + '.' + ext, data: new Uint8Array(await blob.arrayBuffer()) });
  }
  const jsonText = JSON.stringify(sub, null, 2);
  files.push({ name: 'story.json', data: new TextEncoder().encode(jsonText) });
  const zip = zipStore(files);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(zip);
  a.download = 'story-' + bundle.deck.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) + '-submission.zip';
  document.body.appendChild(a); a.click(); URL.revokeObjectURL(a.href); a.remove();
  let body = issueBody(sub, true);
  let fits = encodeURIComponent(body).length <= URL_BODY_BUDGET;
  if (!fits) body = issueBody(sub, false);
  try { await navigator.clipboard.writeText(jsonText); } catch (_) {}
  const url = ISSUE_URL + '?labels=story-submission&title=' + encodeURIComponent('Story submission: ' + bundle.deck.title) + '&body=' + encodeURIComponent(body);
  if (popup) popup.location = url; else window.open(url, '_blank');
  $('status').innerHTML = '';
  const steps = document.createElement('span');
  steps.textContent = 'GitHub opened with the issue pre-filled. Unzip the download, drag the ' + ready.length + ' images into the issue in order' + (fits ? '' : ', paste story.json into the data block (it is also on your clipboard)') + ', then click “Submit new issue”. It goes live on mentria.ai once approved.';
  $('status').append(steps);
  $('status').className = 'status ok';
});

$('export').addEventListener('click', async () => {
  const b = await buildBundle();
  if (!b) return;
  const { bundle, ready, missing } = b;
  const title = bundle.deck.title;
  const blob = new Blob([JSON.stringify(bundle)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'story-' + title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) + '.json';
  document.body.appendChild(a);
  a.click();
  URL.revokeObjectURL(a.href);
  a.remove();
  setStatus('exported ' + ready.length + ' slides' + (missing ? ' (' + missing + ' skipped: missing image or caption)' : '') + ' — saved to your downloads', 'ok');
});

let pvIdx = 0;
let pvSlides = [];
async function pvShow(i) {
  pvIdx = Math.max(0, Math.min(pvSlides.length - 1, i));
  const s = pvSlides[pvIdx];
  const u = await thumbUrl(cur.id + '/' + s.id);
  $('pv-img').src = u || '';
  $('pv-caption').textContent = s.caption || '';
  $('pv-long').textContent = s.long || '';
  $('pv-count').textContent = (pvIdx + 1) + ' / ' + pvSlides.length;
  $('pv-stage').classList.remove('show-long');
}
$('pv-open').addEventListener('click', () => {
  pvSlides = cur.slides.filter((s) => s.hasImage);
  if (!pvSlides.length) { setStatus('no slides with images to preview yet', 'err'); return; }
  $('preview').hidden = false;
  pvShow(0);
});
$('pv-close').addEventListener('click', () => { $('preview').hidden = true; });
$('pv-prev').addEventListener('click', () => pvShow(pvIdx - 1));
$('pv-next').addEventListener('click', () => pvShow(pvIdx + 1));
let pressTimer = 0;
$('pv-stage').addEventListener('pointerdown', () => { pressTimer = setTimeout(() => $('pv-stage').classList.add('show-long'), 380); });
$('pv-stage').addEventListener('pointerup', () => clearTimeout(pressTimer));
document.addEventListener('keydown', (e) => {
  if ($('preview').hidden) return;
  if (e.key === 'Escape') $('preview').hidden = true;
  if (e.key === 'ArrowLeft') pvShow(pvIdx - 1);
  if (e.key === 'ArrowRight') pvShow(pvIdx + 1);
});

renderList();
await room.start();
hello();
setInterval(hello, 30000);
</script>
