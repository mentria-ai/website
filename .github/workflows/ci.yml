name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Check Finance money, sync, import, forecast and tax logic
        run: node scripts/finance-check.mjs
      - name: Check one-unlock formats and rules
        run: node scripts/unlock-check.mjs
      - name: Check one-unlock storage, sync and backups
        run: |
          git fetch --no-tags --depth=1 origin 9570a53e6e846d421cd25ef638d808d5ff55bcba
          node scripts/unlock-storage-check.mjs
      - name: Check Document Scanner geometry, detection and export logic
        run: node scripts/scanner-check.mjs
      - name: Check learning pack review, text and validation logic
        run: node scripts/packs-logic-check.mjs
      - name: Check story submission parsing, validation and upload checks
        run: node scripts/story-check.mjs
      - name: Check extension manifests and version bumps
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          node scripts/extensions-check.mjs origin/main
      - name: Check the bundled learning packs
        run: for f in src/assets/packs/*.mentria.json; do node scripts/pack-check.mjs "$f"; done
      - run: npm run build
      - name: Check built scripts and internal links
        run: node .github/scripts/check-build.mjs build
