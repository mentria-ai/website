let svcState = { s: 'connecting' };
let queueState = null;
let statusMsg = null;
let view = { kind: 'connecting' };
let etaLeft = 0;
let etaTicked = false;

const fmtEta = (ms) => {
  const s = Math.max(0, Math.round(ms / 1000));
  return s >= 60 ? t('etaMin', { m: Math.floor(s / 60), s: NF2.format(s % 60) }) : t('etaSec', { s });
};
function paintStatus() {
  const s = statusMsg;
  els.status.textContent = !s ? '' : s.err ? msgText(s.raw) : t(s.key);
  els.status.className = s && s.err ? 'status err' : 'status';
}
function setStatus(key) { statusMsg = key ? { key } : null; paintStatus(); }
function setError(raw) { statusMsg = { raw, err: true }; paintStatus(); }
function stage(html) { els.stage.innerHTML = html; }
function show(kind, extra) { view = Object.assign({ kind }, extra); paintStage(); }
function paintStage() {
  const v = view;
  if (v.kind === 'connecting') stage('<span class="hint">' + esc(t('connecting')) + '</span>');
  else if (v.kind === 'offline') {
    stage('<span class="big">📴</span><span class="hint">' + esc(t('offlineHint')) + '</span><button class="retry" id="retry" type="button">' + esc(t('checkAgain')) + '</button>');
    $('retry').addEventListener('click', () => { show('connecting'); hello(); });
  } else if (v.kind === 'idle') stage('<span class="big">🎨</span><span class="hint">' + esc(t('idleHint')) + '</span>');
  else if (v.kind === 'queued') stage('<span class="pos">' + esc(t('position', { n: v.pos })) + '</span><span class="eta"></span><span class="hint">' + esc(t('estWait')) + '</span>');
  else if (v.kind === 'rendering') stage('<div class="spin"></div><span class="eta"></span><span class="hint">' + esc(t('renderingImage')) + '</span>');
  else if (v.kind === 'receiving') stage('<div class="bar"><i id="rxbar" style="width:' + v.pct + '%"></i></div><span class="hint">' + esc(t('receiving')) + '</span>');
}
function paintSvc() {
  const st = svcState;
  els.svc.textContent = st.s === 'on' ? (st.info.model || t('ready')) + ' · ' + (st.info.dims ? st.info.dims.join('×') : '') : t(st.s === 'off' ? 'nodeOffline' : 'connectingShort');
}
function setOnline(on, info) {
  online = on;
  els.dot.className = 'dot ' + (on ? 'on' : 'off');
  svcState = on ? { s: 'on', info } : { s: 'off' };
  paintSvc();
  els.prompt.disabled = !on;
  els.go.disabled = !on || !!myJob;
  if (on) { paintQueue(info.queue, info.avgMs); paintLoras(info.loras); }
  else {
    queueState = null;
    paintQueueInfo();
    show('offline');
  }
}
function paintQueue(q, avgMs) { queueState = { q, avgMs }; paintQueueInfo(); }
function paintQueueInfo() {
  const qs = queueState;
  els.qinfo.textContent = !qs ? '' : qs.q > 0 ? t('inQueue', { n: qs.q, eta: fmtEta(qs.q * (qs.avgMs || 40000)) }) : t('queueEmpty');
}
function etaText() { return etaTicked && !(etaLeft > 0) ? t('soon') : fmtEta(etaLeft); }
function paintEta() {
  const e = els.stage.querySelector('.eta');
  if (e) e.textContent = etaText();
}
function countdown(ms) {
  clearInterval(etaTimer);
  etaLeft = ms;
  etaTicked = false;
  paintEta();
  etaTimer = setInterval(() => {
    etaLeft -= 1000;
    etaTicked = true;
    paintEta();
  }, 1000);
}

async function hello() {
  try {
    const info = await room.request('hello', {}, 8000);
    setOnline(!!info.ready, info);
    if (!info.ready) setOnline(false, {});
    else stageIdle();
  } catch (_) {
    setOnline(false, {});
  }
}
function stageIdle() {
  if (lastBlobUrl) return;
  show('idle');
}

room.onPush = (event, data) => {
  if (!myJob || !data || data.job !== myJob) return;
  if (event === 'job:pos') {
    if (typeof data.queue === 'number') paintQueue(data.queue, null);
    show('queued', { pos: parseInt(data.pos, 10) || 0 });
    countdown(data.etaMs);
  } else if (event === 'job:start') {
    show('rendering');
    countdown(data.etaMs || 40000);
    setStatus('rendering');
  } else if (event === 'job:done') {
    chunks = { mime: data.mime, total: data.chunks, got: 0, parts: new Array(data.chunks) };
    show('receiving', { pct: 0 });
    clearInterval(etaTimer);
  } else if (event === 'job:chunk' && chunks) {
    if (!chunks.parts[data.i]) { chunks.parts[data.i] = fromB64(data.b64); chunks.got++; }
    const pct = Math.round((chunks.got / chunks.total) * 100);
    if (view.kind === 'receiving') view.pct = pct;
    const bar = $('rxbar');
    if (bar) bar.style.width = pct + '%';
    if (chunks.got === chunks.total) finishImage();
  } else if (event === 'job:error') {
    clearInterval(etaTimer);
    myJob = null; chunks = null;
    els.go.disabled = !online;
    setError(data.message || 'generation failed');
    stageIdle();
    refreshQueueInfo();
  }
};

function finishImage() {
  const blob = new Blob(chunks.parts, { type: chunks.mime });
  if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
  lastBlobUrl = URL.createObjectURL(blob);
  view = { kind: 'image' };
  stage('');
  const img = document.createElement('img');
  img.src = lastBlobUrl;
  img.alt = els.prompt.value;
  els.stage.appendChild(img);
  els.dl.href = lastBlobUrl;
  els.dl.download = 'mentria-' + (els.prompt.value || 'image').slice(0, 24).replace(/[^a-z0-9]+/gi, '-').toLowerCase() + (chunks.mime === 'image/png' ? '.png' : '.webp');
  els.actions.hidden = false;
  setStatus('done');
  notify(t('imageReady'));
  myJob = null; chunks = null;
  els.go.disabled = !online;
  clearInterval(etaTimer);
  refreshQueueInfo();
}

function refreshQueueInfo() {
  room.request('status', {}, 8000).then((s) => paintQueue(s.queue, s.avgMs)).catch(() => {});
}

async function generate() {
  const prompt = els.prompt.value.trim();
  if (!prompt || myJob) return;
  els.go.disabled = true;
  els.actions.hidden = true;
  setStatus('submitting');
  try {
    const r = await room.request('generate', els.lora.value ? { prompt, lora: els.lora.value } : { prompt }, 15000);
    myJob = r.job;
    setStatus('');
    paintQueue(r.queue, null);
    show('queued', { pos: parseInt(r.pos, 10) || 0 });
    countdown(r.etaMs);
  } catch (e) {
    setError(String(e.message || e));
    els.go.disabled = false;
    if (/timeout/.test(String(e.message))) setOnline(false, {});
  }
}

els.go.addEventListener('click', generate);
els.again.addEventListener('click', () => { els.actions.hidden = true; if (lastBlobUrl) { URL.revokeObjectURL(lastBlobUrl); lastBlobUrl = null; } stageIdle(); els.prompt.focus(); });
els.prompt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); generate(); } });

function paintStatic() {
  els.prompt.placeholder = t('placeholder');
  els.loralabel.textContent = t('style');
  els.go.textContent = t('generate');
  els.dl.textContent = t('download');
  els.again.textContent = t('again');
}
function render() {
  paintStatic();
  paintSvc();
  paintQueueInfo();
  paintLoras(LORAS);
  paintStatus();
  paintStage();
  paintEta();
}
if (typeof m.onLocaleChange === 'function') m.onLocaleChange(function (code) {
  setLocale(code);
  render();
});
setLocale(m.locale || document.documentElement.lang || navigator.language);
render();

room.start();
await hello();
setInterval(() => {
  if (myJob || document.hidden) return;
  if (online) refreshQueueInfo();
  else hello();
}, 30000);
document.addEventListener('visibilitychange', () => { if (!online && !myJob && !document.hidden) hello(); });

if (m.args && m.args.cmd === 'imagine' && m.args.args) {
  els.prompt.value = m.args.args;
}
</script>
