<script type="application/json" id="mentria-ext">
{
  "id": "pomodoro-timer",
  "name": "Pomodoro Timer",
  "version": "1.2.0",
  "icon": "🍅",
  "author": "Mentria",
  "description": "In-page focus timer with work and break phases. State survives reloads.",
  "permissions": ["storage"],
  "mounts": {
    "tool": {},
    "commands": [
      { "name": "pomodoro", "usage": "pomodoro [minutes]", "description": "start a focus session, optionally set the work length" }
    ]
  }
}
</script>
<style>
  :root {
    --ext-accent: #6ef3c5;
    --ext-bg: #0b0e11;
    --ext-fg: #e6edf3;
    --ext-muted: #8b98a5;
    --ext-font: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1.5rem 1.25rem; font-family: var(--ext-font); background: var(--ext-bg); color: var(--ext-fg); }
  .wrap { max-width: 24rem; margin: 0 auto; text-align: center; }
  .phase { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ext-muted); }
  .phase[data-p="break"] { color: var(--ext-accent); }
  .clock { font-size: 4rem; font-weight: 600; margin: 0.4rem 0 0.2rem; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .done { font-size: 0.72rem; color: var(--ext-muted); margin-bottom: 1.1rem; }
  .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 1.4rem; }
  button { background: transparent; border: 1px solid #2a3138; color: var(--ext-fg); border-radius: 8px; padding: 0.55rem 1.1rem; font-family: inherit; font-size: 0.9rem; cursor: pointer; }
  button.primary { border-color: var(--ext-accent); color: var(--ext-accent); }
  .toggle { display: inline-grid; }
  .toggle > span { grid-area: 1 / 1; }
  .toggle > .off { visibility: hidden; }
  button:hover { border-color: var(--ext-accent); }
  button:focus-visible { outline: 2px solid var(--ext-accent); outline-offset: 1px; }
  .settings { display: flex; gap: 1rem; justify-content: center; }
  .settings label { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 0.3rem; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ext-muted); }
  .settings input { width: 5rem; background: #10141a; border: 1px solid #2a3138; border-radius: 6px; padding: 0.4rem; color: var(--ext-fg); font-family: inherit; font-size: 0.95rem; text-align: center; }
</style>
<div class="wrap">
  <div class="phase" id="phase" data-p="work"></div>
  <div class="clock" id="clock" aria-live="polite"></div>
  <div class="done" id="done"></div>
  <div class="controls">
    <button class="primary toggle" id="toggle" type="button"><span id="start-label"></span><span id="pause-label" class="off"></span></button>
    <button id="reset" type="button"></button>
    <button id="skip" type="button"></button>
  </div>
  <div class="settings">
    <label><span id="work-label"></span><input id="work" type="number" min="1" max="180" value="25"></label>
    <label><span id="break-label"></span><input id="break" type="number" min="1" max="60" value="5"></label>
  </div>
</div>
<script>
  (function () {
    var m = window.mentria || {};
    var storage = m.storage || { get: function () { return null; }, set: function () {} };
    var notify = m.notify || function () {};
    if (m.theme) {
      var r = document.documentElement;
      var map = { accent: '--ext-accent', bg: '--ext-bg', fg: '--ext-fg', muted: '--ext-muted', fontMono: '--ext-font' };
      Object.keys(map).forEach(function (k) { if (m.theme[k]) r.style.setProperty(map[k], m.theme[k]); });
    }

    var LOCS = ['en', 'es', 'fr', 'ja', 'pt-BR'];
    var STR = {
      en: {
        focus: 'Focus', brk: 'Break',
        done: { one: '{n} session completed', other: '{n} sessions completed' },
        start: 'Start', pause: 'Pause', reset: 'Reset', skip: 'Skip',
        workMin: 'Focus min', breakMin: 'Break min',
        toBreak: 'Break time 🍵', toFocus: 'Back to focus 🍅'
      },
      es: {
        focus: 'Concentración', brk: 'Descanso',
        done: { one: '{n} sesión completada', other: '{n} sesiones completadas' },
        start: 'Iniciar', pause: 'Pausar', reset: 'Reiniciar', skip: 'Saltar',
        workMin: 'Concentración (min)', breakMin: 'Descanso (min)',
        toBreak: 'Hora de descansar 🍵', toFocus: 'Vuelve a concentrarte 🍅'
      },
      fr: {
        focus: 'Concentration', brk: 'Pause',
        done: { one: '{n} session terminée', other: '{n} sessions terminées' },
        start: 'Démarrer', pause: 'Pause', reset: 'Réinitialiser', skip: 'Passer',
        workMin: 'Concentration (min)', breakMin: 'Pause (min)',
        toBreak: 'C’est l’heure de la pause 🍵', toFocus: 'Retour à la concentration 🍅'
      },
      ja: {
        focus: '集中', brk: '休憩',
        done: '完了したセッション:{n}回',
        start: '開始', pause: '一時停止', reset: 'リセット', skip: 'スキップ',
        workMin: '集中(分)', breakMin: '休憩(分)',
        toBreak: '休憩しましょう 🍵', toFocus: '集中に戻りましょう 🍅'
      },
      'pt-BR': {
        focus: 'Foco', brk: 'Pausa',
        done: { one: '{n} sessão concluída', other: '{n} sessões concluídas' },
        start: 'Iniciar', pause: 'Pausar', reset: 'Reiniciar', skip: 'Pular',
        workMin: 'Foco (min)', breakMin: 'Pausa (min)',
        toBreak: 'Hora da pausa 🍵', toFocus: 'De volta ao foco 🍅'
      }
    };

    var phaseEl = document.getElementById('phase');
    var clockEl = document.getElementById('clock');
    var doneEl = document.getElementById('done');
    var toggleEl = document.getElementById('toggle');
    var startLabelEl = document.getElementById('start-label');
    var pauseLabelEl = document.getElementById('pause-label');
    var resetEl = document.getElementById('reset');
    var skipEl = document.getElementById('skip');
    var workEl = document.getElementById('work');
    var breakEl = document.getElementById('break');
    var workLabelEl = document.getElementById('work-label');
    var breakLabelEl = document.getElementById('break-label');

    var L = 'en', PR, NF, NF2;
    function pickLoc(c) {
      c = String(c || 'en');
      if (LOCS.indexOf(c) >= 0) return c;
      var b = c.slice(0, 2).toLowerCase();
      if (b === 'pt') return 'pt-BR';
      return LOCS.indexOf(b) >= 0 ? b : 'en';
    }
    function setLocale(c) {
      L = pickLoc(c);
      document.documentElement.lang = L;
      try { PR = new Intl.PluralRules(L); } catch (e) { PR = { select: function (n) { return n === 1 ? 'one' : 'other'; } }; }
      NF = new Intl.NumberFormat(L, { maximumFractionDigits: 0 });
      NF2 = new Intl.NumberFormat(L, { minimumIntegerDigits: 2, useGrouping: false });
      startLabelEl.textContent = t('start');
      pauseLabelEl.textContent = t('pause');
      resetEl.textContent = t('reset');
      skipEl.textContent = t('skip');
      workLabelEl.textContent = t('workMin');
      breakLabelEl.textContent = t('breakMin');
    }
    function t(k, v) {
      var str = STR[L] && STR[L][k] != null ? STR[L][k] : STR.en[k];
      if (str == null) return k;
      if (typeof str === 'object') {
        var n = v && typeof v.n === 'number' ? v.n : 1;
        str = str[PR.select(n)] || str.other;
      }
      if (v) str = str.replace(/\{(\w+)\}/g, function (a, b) { return v[b] == null ? a : (typeof v[b] === 'number' ? NF.format(v[b]) : String(v[b])); });
      return str;
    }

    var s = storage.get('state') || { phase: 'work', running: false, endsAt: 0, remaining: 25 * 60, work: 25, brk: 5, done: 0 };
    if (typeof s.work !== 'number') s.work = 25;
    if (typeof s.brk !== 'number') s.brk = 5;
    workEl.value = s.work;
    breakEl.value = s.brk;

    function total() { return (s.phase === 'work' ? s.work : s.brk) * 60; }
    function save() { storage.set('state', s); }
    function left() {
      if (s.running) return Math.max(0, Math.round((s.endsAt - Date.now()) / 1000));
      return s.remaining;
    }
    function render() {
      var sec = left();
      clockEl.textContent = NF2.format(Math.floor(sec / 60)) + ':' + NF2.format(sec % 60);
      phaseEl.textContent = t(s.phase === 'work' ? 'focus' : 'brk');
      phaseEl.dataset.p = s.phase;
      doneEl.textContent = t('done', { n: s.done });
      startLabelEl.classList.toggle('off', s.running);
      pauseLabelEl.classList.toggle('off', !s.running);
    }

    var audio = null;
    function wakeAudio() {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      try {
        if (!audio) audio = new Ctx();
        if (audio.state === 'suspended') audio.resume();
      } catch (e) { audio = null; }
    }
    function chime() {
      if (navigator.vibrate) { try { navigator.vibrate([200, 120, 200]); } catch (e) {} }
      if (!audio) return;
      try {
        var t0 = audio.currentTime;
        [880, 660, 880].forEach(function (f, i) {
          var o = audio.createOscillator();
          var g = audio.createGain();
          o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t0 + i * 0.22);
          g.gain.exponentialRampToValueAtTime(0.25, t0 + i * 0.22 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.22 + 0.2);
          o.connect(g);
          g.connect(audio.destination);
          o.start(t0 + i * 0.22);
          o.stop(t0 + i * 0.22 + 0.21);
        });
      } catch (e) {}
    }

    function advance(skipped) {
      if (s.phase === 'work') { if (!skipped) s.done += 1; s.phase = 'break'; } else { s.phase = 'work'; }
      s.remaining = total();
      s.running = false;
      s.endsAt = 0;
      save();
      render();
      if (!skipped) chime();
      notify(t(s.phase === 'break' ? 'toBreak' : 'toFocus'));
    }

    function tick() {
      if (!s.running) return;
      if (left() <= 0) { advance(); return; }
      render();
    }

    function start() {
      wakeAudio();
      if (s.remaining <= 0) s.remaining = total();
      s.endsAt = Date.now() + s.remaining * 1000;
      s.running = true;
      save();
      render();
    }
    function pause() {
      s.remaining = left();
      s.running = false;
      s.endsAt = 0;
      save();
      render();
    }

    toggleEl.addEventListener('click', function () { s.running ? pause() : start(); });
    resetEl.addEventListener('click', function () {
      s.running = false; s.endsAt = 0; s.remaining = total(); save(); render();
    });
    skipEl.addEventListener('click', function () { advance(true); });

    function onSetting() {
      s.work = Math.min(180, Math.max(1, parseInt(workEl.value, 10) || 25));
      s.brk = Math.min(60, Math.max(1, parseInt(breakEl.value, 10) || 5));
      workEl.value = s.work;
      breakEl.value = s.brk;
      if (!s.running) s.remaining = total();
      save(); render();
    }
    workEl.addEventListener('change', onSetting);
    breakEl.addEventListener('change', onSetting);

    if (typeof m.onLocaleChange === 'function') m.onLocaleChange(function (code) {
      setLocale(code);
      render();
    });

    setLocale(m.locale || document.documentElement.lang || navigator.language);

    if (m.args && m.args.cmd === 'pomodoro') {
      var mins = parseInt(String(m.args.args || '').trim(), 10);
      if (mins > 0) { s.work = Math.min(180, mins); workEl.value = s.work; }
      s.phase = 'work'; s.remaining = total(); start();
    }

    if (s.running && left() <= 0) advance();
    render();
    setInterval(tick, 250);
  })();
</script>
