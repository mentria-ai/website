<script type="application/json" id="mentria-ext">
{
  "id": "dice-roller",
  "name": "Dice Roller",
  "version": "1.2.1",
  "icon": "🎲",
  "author": "Mentria",
  "description": "Roll dice with standard notation and pick randomly from a list.",
  "permissions": ["storage"],
  "mounts": {
    "tool": {},
    "commands": [
      { "name": "roll", "usage": "roll <NdM>", "description": "roll dice, e.g. roll 2d6+1" }
    ]
  }
}
</script>
<style>
  :root {
    --ext-accent: #6ef3c5;
    --ext-bg: #0b0e11;
    --ext-fg: #e6edf3;
    --ext-muted: #8b98a5;
    --ext-font: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1.5rem 1.25rem; font-family: var(--ext-font); background: var(--ext-bg); color: var(--ext-fg); }
  .wrap { max-width: 30rem; margin: 0 auto; }
  h1 { font-size: 1.05rem; margin: 0 0 1rem; font-weight: 600; }
  h2 { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ext-muted); margin: 1.4rem 0 0.5rem; font-weight: 600; }
  .quick { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.7rem; }
  .quick button { padding: 0.35rem 0.7rem; font-size: 0.78rem; }
  .roll-row { display: flex; gap: 0.5rem; }
  input, textarea { background: #10141a; border: 1px solid #2a3138; border-radius: 6px; padding: 0.5rem 0.6rem; color: var(--ext-fg); font-family: inherit; font-size: 0.95rem; }
  #notation { flex: 1; }
  textarea { width: 100%; resize: vertical; min-height: 4.5rem; margin-bottom: 0.5rem; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ext-accent); outline-offset: 1px; }
  button { background: transparent; border: 1px solid #2a3138; color: var(--ext-fg); border-radius: 6px; padding: 0.5rem 1rem; font-family: inherit; font-size: 0.9rem; cursor: pointer; }
  button.primary { border-color: var(--ext-accent); color: var(--ext-accent); }
  button:hover { border-color: var(--ext-accent); }
  .out { margin-top: 0.9rem; padding: 0.9rem 1rem; border: 1px solid #2a3138; border-radius: 8px; background: #10141a; min-height: 2.4rem; }
  .out b { display: inline-block; color: var(--ext-accent); font-size: 1.6rem; }
  .out small { display: block; color: var(--ext-muted); margin-top: 0.3rem; font-size: 0.72rem; word-break: break-word; }
  .out .pop { animation: pop 0.28s ease-out; }
  @keyframes pop { from { opacity: 0.25; transform: scale(0.82); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0.25; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .out .pop { animation-name: fade; } }
</style>
<div class="wrap">
  <h1>🎲 <span data-t="title"></span></h1>
  <div class="quick" id="quick"></div>
  <div class="roll-row">
    <input id="notation" type="text" value="2d6" spellcheck="false" data-t-label="notation" placeholder="2d6+1">
    <button class="primary" id="roll" type="button" data-t="roll"></button>
  </div>
  <div class="out" aria-live="polite">
    <b id="total">—</b>
    <small id="breakdown"></small>
  </div>

  <h2 data-t="picker"></h2>
  <textarea id="items" spellcheck="false" data-t-ph="itemsPh" data-t-label="items"></textarea>
  <button id="pick" type="button" data-t="pick"></button>
  <div class="out" aria-live="polite">
    <b id="picked">—</b>
  </div>
</div>
<script>
  (function () {
    var m = window.mentria || {};
    var storage = m.storage || { get: function () { return null; }, set: function () {} };
    if (m.theme) {
      var r = document.documentElement;
      var map = { accent: '--ext-accent', bg: '--ext-bg', fg: '--ext-fg', muted: '--ext-muted', fontMono: '--ext-font' };
      Object.keys(map).forEach(function (k) { if (m.theme[k]) r.style.setProperty(map[k], m.theme[k]); });
    }

    var LOCS = ['en', 'es', 'fr', 'ja', 'pt-BR'];
    var STR = {
      en: {
        title: 'Dice Roller', notation: 'Dice notation', roll: 'Roll',
        hint: 'try e.g. 2d6 or 1d20+3', limits: 'up to {dice} dice with up to {sides} sides',
        picker: 'Random picker', items: 'Options to pick from', itemsPh: 'one option per line', pick: 'Pick one'
      },
      es: {
        title: 'Lanzador de dados', notation: 'Notación de dados', roll: 'Tirar',
        hint: 'prueba con 2d6 o 1d20+3', limits: 'hasta {dice} dados de hasta {sides} caras',
        picker: 'Sorteo', items: 'Opciones para el sorteo', itemsPh: 'una opción por línea', pick: 'Elegir una'
      },
      fr: {
        title: 'Lanceur de dés', notation: 'Notation des dés', roll: 'Lancer',
        hint: 'essayez par exemple 2d6 ou 1d20+3', limits: 'jusqu’à {dice} dés, chacun à {sides} faces au maximum',
        picker: 'Tirage au sort', items: 'Options du tirage', itemsPh: 'une option par ligne', pick: 'Tirer au sort'
      },
      ja: {
        title: 'ダイスローラー', notation: 'ダイスの記法', roll: '振る',
        hint: '2d6 や 1d20+3 のように入力してください', limits: 'ダイスは{dice}個まで、面の数は{sides}までです',
        picker: 'ランダム抽選', items: '抽選する候補', itemsPh: '1行に1つずつ候補を入力', pick: '1つ選ぶ'
      },
      'pt-BR': {
        title: 'Rolador de dados', notation: 'Notação de dados', roll: 'Rolar',
        hint: 'tente, por exemplo, 2d6 ou 1d20+3', limits: 'até {dice} dados de até {sides} faces',
        picker: 'Sorteio', items: 'Opções para sortear', itemsPh: 'uma opção por linha', pick: 'Sortear uma'
      }
    };
    var MAX_DICE = 100, MAX_SIDES = 1000;

    var L = 'en', NF0;
    function pickLoc(c) {
      c = String(c || 'en');
      if (LOCS.indexOf(c) >= 0) return c;
      var b = c.slice(0, 2).toLowerCase();
      if (b === 'pt') return 'pt-BR';
      return LOCS.indexOf(b) >= 0 ? b : 'en';
    }
    function setLocale(c) {
      L = pickLoc(c);
      document.documentElement.lang = L;
      NF0 = new Intl.NumberFormat(L, { maximumFractionDigits: 0 });
    }
    function t(k, v, loc) {
      var d = STR[loc || L];
      var s = d && d[k] != null ? d[k] : STR.en[k];
      if (s == null) return k;
      if (v) s = s.replace(/\{(\w+)\}/g, function (a, b) { return v[b] == null ? a : String(v[b]); });
      return s;
    }
    function num(n) { return NF0.format(n); }

    function rnd(n) {
      if (window.crypto && crypto.getRandomValues) {
        var a = new Uint32Array(1); crypto.getRandomValues(a);
        return a[0] % n;
      }
      return Math.floor(Math.random() * n);
    }

    var notationEl = document.getElementById('notation');
    var totalEl = document.getElementById('total');
    var breakdownEl = document.getElementById('breakdown');
    var itemsEl = document.getElementById('items');
    var pickedEl = document.getElementById('picked');

    var saved = storage.get('state') || {};
    if (saved.notation) notationEl.value = saved.notation;
    if (saved.items) itemsEl.value = saved.items;

    var res = null;

    function view(loc, f) {
      if (!res) return { total: '—', breakdown: '' };
      if (res.err) return { total: '—', breakdown: t(res.err, { dice: f(MAX_DICE), sides: f(MAX_SIDES) }, loc) };
      return { total: f(res.total), breakdown: '[' + res.rolls.map(f).join(', ') + ']' + (res.mod ? (res.mod > 0 ? ' +' : ' ') + f(res.mod) : '') };
    }

    function show(el, text, fresh) {
      if (fresh) el.replaceChildren(document.createTextNode(text));
      else if (el.textContent !== text) el.textContent = text;
    }
    function flash(el) {
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    }

    function paint(fresh) {
      var v = view(L, num);
      show(totalEl, v.total, fresh);
      show(breakdownEl, v.breakdown, fresh);
      if (fresh) flash(totalEl);
    }

    function render() {
      document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
      document.querySelectorAll('[data-t-label]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-t-label'))); });
      document.querySelectorAll('[data-t-ph]').forEach(function (el) { el.setAttribute('placeholder', t(el.getAttribute('data-t-ph'))); });
      paint();
    }

    function roll(fresh) {
      var mch = notationEl.value.replace(/\s+/g, '').match(/^(\d*)d(\d+)([+-]\d+)?$/i);
      var count = mch ? parseInt(mch[1] || '1', 10) : 0;
      var sides = mch ? parseInt(mch[2], 10) : 0;
      if (!mch || count < 1 || sides < 1) { res = { err: 'hint' }; paint(fresh); return; }
      if (count > MAX_DICE || sides > MAX_SIDES) { res = { err: 'limits' }; paint(fresh); return; }
      var mod = parseInt(mch[3] || '0', 10);
      var rolls = [], sum = 0;
      for (var i = 0; i < count; i++) { var v = rnd(sides) + 1; rolls.push(v); sum += v; }
      res = { rolls: rolls, mod: mod, total: sum + mod };
      paint(fresh);
      storage.set('state', { notation: notationEl.value, items: itemsEl.value });
    }

    function pick() {
      var opts = itemsEl.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
      if (!opts.length) { show(pickedEl, '—', true); flash(pickedEl); return; }
      show(pickedEl, opts[rnd(opts.length)], true);
      flash(pickedEl);
      storage.set('state', { notation: notationEl.value, items: itemsEl.value });
    }

    var quick = document.getElementById('quick');
    ['d4', 'd6', 'd8', 'd10', 'd12', 'd20', 'd100'].forEach(function (d) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = d;
      b.addEventListener('click', function () { notationEl.value = '1' + d; roll(true); });
      quick.appendChild(b);
    });

    import('/assets/js/mentria-bus.js').then(function (mod) {
      mod.MentriaBus.provide('dice.roll', function (p) {
        var notation = String((p || {}).notation || '').trim();
        if (!/^\d*d\d+([+-]\d+)?$/i.test(notation)) throw new Error('use dice notation like 2d6 or 1d20+3');
        notationEl.value = notation;
        roll(true);
        return view('en', String);
      }, { description: 'Roll dice with standard notation (for example 2d6 or 1d20+3); the roll is shown in the tool.', parameters: { type: 'object', properties: { notation: { type: 'string' } }, required: ['notation'] }, ai: true });
    }).catch(function () {});

    document.getElementById('roll').addEventListener('click', function () { roll(true); });
    notationEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') roll(true); });
    document.getElementById('pick').addEventListener('click', pick);
    itemsEl.addEventListener('change', function () { storage.set('state', { notation: notationEl.value, items: itemsEl.value }); });

    if (typeof m.onLocaleChange === 'function') m.onLocaleChange(function (code) {
      setLocale(code);
      render();
    });

    setLocale(m.locale || document.documentElement.lang || navigator.language);
    render();
    if (m.args && m.args.cmd === 'roll' && m.args.args) {
      notationEl.value = String(m.args.args).trim();
    }
    roll();
  })();
</script>
