    add(main, h('div', { class: 'actions' }, h('button', { class: 'btn primary', type: 'button', onclick: exportData }, t('dt_export'))));
    add(main, h('p', { class: 'muted small' }, t('dt_export_h')));
    var persistOut = h('p', { class: 'small', 'aria-live': 'polite' });
    add(main, h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', onclick: function () {
      var st = navigator.storage;
      if (!st || typeof st.persist !== 'function') { persistOut.textContent = t('dt_persist_na'); return; }
      st.persist().then(function (ok) { persistOut.textContent = t(ok ? 'dt_persist_yes' : 'dt_persist_no'); }, function () { persistOut.textContent = t('dt_persist_na'); });
    } }, t('dt_persist'))));
    add(main, persistOut);
    add(main, h('hr', { class: 'sep' }));
    add(main, h('div', { class: 'actions' }, h('button', { class: 'btn danger', type: 'button', onclick: function () {
      ask('dt_delete_q', 'dt_delete_ok', function () {
        Object.keys(saveTimers).forEach(function (k) { clearTimeout(saveTimers[k]); saveTimers[k] = 0; });
        Promise.resolve(db.clear()).then(function () {
          KEYS.forEach(function (k) { S[k] = defaults(k); });
          weekSel = null;
          calMonth = null;
          notify(t('dt_deleted'));
          render(true);
        }, function () { notify(t('save_fail')); });
      });
    } }, t('dt_delete'))));
  };

  function exportData() {
    flush();
    var out = { app: 'pregnancy-check', version: VERSION, exportedAt: new Date().toISOString(), data: {} };
    Promise.resolve(db.keys()).then(function (keys) {
      return Promise.all(keys.map(function (k) { return Promise.resolve(db.get(k)).then(function (v) { out.data[k] = v; }); }));
    }).then(function () {
      var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = h('a', { href: url, download: 'pregnancy-check-' + isoDay(todayNum()) + '.json', hidden: true });
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
      notify(t('dt_exported'));
    }, function () { notify(t('save_fail')); });
  }

  var SOURCES = [
    ['src_medline', ['medlineplus.gov/pregnancy.html', 'medlineplus.gov/lab-tests/pregnancy-test/', 'medlineplus.gov/preconceptioncare.html', 'medlineplus.gov/prenatalcare.html', 'medlineplus.gov/fetalhealthanddevelopment.html', 'medlineplus.gov/ectopicpregnancy.html']],
    ['src_cdc', ['www.cdc.gov/pregnancy/about/index.html', 'www.cdc.gov/folic-acid/about/index.html', 'www.cdc.gov/hearher/maternal-warning-signs/index.html']],
    ['src_who', ['www.who.int/publications/i/item/9789241549912', 'www.who.int/tools/elena/interventions/folate-periconceptional', 'www.who.int/news-room/fact-sheets/detail/emergency-contraception']],
    ['src_nhs', ['www.nhs.uk/pregnancy/trying-for-a-baby/doing-a-pregnancy-test/', 'www.nhs.uk/pregnancy/finding-out/due-date-calculator/', 'www.nhs.uk/pregnancy/keeping-well/your-babys-movements/', 'www.nhs.uk/conditions/ectopic-pregnancy/']],
    ['src_acog', ['www.acog.org/womens-health/faqs/how-your-fetus-grows-during-pregnancy', 'www.acog.org/womens-health/faqs/fertility-awareness-based-methods-of-family-planning']],
    ['src_owh', ['womenshealth.gov/pregnancy/youre-pregnant-now-what/stages-pregnancy']]
  ];
  VIEWS.about = function (main) {
    add(main, h('div', { class: 'note warn' }, h('strong', null, t('disclaimer'))));
    add(main, h('p', null, t('ab_what')));
    add(main, h('h2', null, t('ab_how')));
    add(main, h('ul', { class: 'plain' }, ['f_test', 'f_fertile', 'f_lmp', 'f_conc', 'f_ivf', 'f_clin', 'f_tri'].map(function (k) { return h('li', null, t(k)); })));
    add(main, h('h2', null, t('ab_src')));
    add(main, h('p', { class: 'muted small' }, t('ab_src_h')));
    add(main, h('ul', { class: 'src' }, SOURCES.map(function (s) {
      return h('li', null, h('b', null, t(s[0])), s[1].map(function (u) { return h('code', null, u); }));
    })));
    add(main, h('p', null, t('ab_privacy')));
    add(main, h('p', { class: 'muted small' }, t('ab_version', { v: VERSION })));
  };

  setInterval(function () { tickers.forEach(function (fn) { fn(); }); }, 1000);
  if (typeof m.onLocaleChange === 'function') {
    m.onLocaleChange(function (code) {
      var next = pick(code);
      if (next === loc) return;
      loc = next;
      render(false);
    });
  }
  var started = false;
  function start() {
    if (started) return;
    started = true;
    render(false);
  }
  load().then(function () { if (started) render(false); else start(); }, start);
  setTimeout(start, 1500);
})();
</script>
